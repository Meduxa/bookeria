<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookeria — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #1f2430;
        --muted: #5d6573;
        --card: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171c;
          --fg: #f1f2f4;
          --muted: #a9aeb7;
          --card: #1d2026;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          "Noto Sans Georgian",
          sans-serif;
        padding: 16px;
      }
      main {
        max-width: 26rem;
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 12px;
      }
      button {
        font: inherit;
        padding: 10px 20px;
        border-radius: 10px;
        border: 0;
        background: #16233a;
        color: #fff;
        cursor: pointer;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ინტერნეტთან კავშირი არ არის</h1>
      <p>Bookeria-ს სჭირდება ინტერნეტი. შეამოწმეთ კავშირი და სცადეთ ხელახლა.</p>
      <p lang="en">You are offline. Bookeria needs the internet — check your connection and try again.</p>
      <p lang="ru">Нет подключения к интернету. Проверьте связь и попробуйте снова.</p>
      <button type="button" onclick="location.reload()">ხელახლა · Retry · Повторить</button>
    </main>
  </body>
</html>
